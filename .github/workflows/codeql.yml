name: CodeQL

# 2026-08-15 — SECURITY.md has claimed "Automated vulnerability scanning
# in CI" since 2026-08-07, but no workflow in this repo ever ran a
# security scanner; that line was aspirational, not real. This closes the
# gap for real rather than just removing the claim.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, not just on push/PR — CodeQL's own query packs get updated
    # independently of this repo's commits, so a dependency-free branch
    # can still surface a newly-added finding against unchanged code.
    - cron: '0 6 * * 1'

# CTO 403 - cancel only the OBSOLETE runs of the same pull request. A pull_request run belongs to the group "<workflow>-pr-<number>":
# a newer run of the same PR replaces an older one still queued or running. Every other event (push to main, schedule, manual
# dispatch) gets a group of its own per run (run_id), so it can never be cancelled, never cancels anything and never queues behind
# another run. Different PRs have different numbers and never share a group. cancel-in-progress is true only for pull_request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: javascript-typescript
          # security-extended: CodeQL's default query pack is precision-
          # tuned to minimize false positives; security-extended adds
          # broader coverage (includes lower-confidence queries) —
          # deliberate tradeoff for a pre-audit reference implementation
          # where surfacing more candidates for human review matters more
          # than a quiet CI log.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          category: '/language:javascript-typescript'
