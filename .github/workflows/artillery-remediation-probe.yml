name: Artillery advisory remediation probe

on:
  push:
    branches:
      - security/artillery-audit-remediation-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-artillery-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify baseline and generate npm-resolved candidate without committing
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node -e 'const p=require("./package.json"); if(!p.devDependencies?.artillery) process.exit(1)'
          npm audit --json > baseline-artillery-audit.json || true
          npm update artillery --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git diff -- package.json package-lock.json > artillery-update-candidate.patch
          node -e 'const l=require("./package-lock.json"); console.log("Artillery candidate:",l.packages["node_modules/artillery"]?.version)'
          npm ci --no-audit --no-fund
          npm audit --json > candidate-artillery-audit.json || true
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('baseline-artillery-audit.json'));
          const after=JSON.parse(fs.readFileSync('candidate-artillery-audit.json'));
          const b=before.vulnerabilities||{}, a=after.vulnerabilities||{};
          const removed=Object.keys(b).filter(k=>!a[k]), added=Object.keys(a).filter(k=>!b[k]);
          const changed=Object.keys(a).filter(k=>b[k]&&b[k].severity!==a[k].severity).map(k=>({name:k,before:b[k].severity,after:a[k].severity}));
          const result={baseline:before.metadata?.vulnerabilities,candidate:after.metadata?.vulnerabilities,removed,added,changed,artillery:require('./package-lock.json').packages['node_modules/artillery']?.version};
          fs.writeFileSync('artillery-probe-summary.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Upload audit and patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artillery-remediation-probe
          path: |
            baseline-artillery-audit.json
            candidate-artillery-audit.json
            artillery-probe-summary.json
            artillery-update-candidate.patch
          if-no-files-found: warn
