            relativePath: log.includes('../../node_modules/tweetnacl/nacl-fast.js'),
          }));
          // String matching only: diagnostics must never fail due to a malformed regex.
          const lower=log.toLowerCase();
          const has=(...terms)=>terms.some(term=>lower.includes(term.toLowerCase()));
          const reasons={
            webcryptoUnavailable: has('K6_CRYPTO_PREFLIGHT_WEBCRYPTO_UNAVAILABLE'),
            moduleResolution: has('unknown module','could not resolve','module not found'),
            tweetnaclInitialization: has('tweetnacl','nacl-fast'),
