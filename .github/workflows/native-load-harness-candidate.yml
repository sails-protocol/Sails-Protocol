name: Native load harness candidate verification
on:
  push:
    branches: [security/artillery-native-loadtest-replacement]
  pull_request:
    branches: [security/ts-node-dev-removal-validated]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Dependency-free syntax and safety guard checks
        run: |
          node --check load-tests/testkit/loopback-target.cjs
          node --check load-tests/testkit/loopback-target.test.cjs
          node load-tests/testkit/loopback-target.test.cjs
          node --check load-tests/testkit/protocol-assertions.cjs
          node --check load-tests/testkit/protocol-assertions.test.cjs
          node load-tests/testkit/protocol-assertions.test.cjs
          node --check load-tests/testkit/ws-protocol.cjs
          node --check load-tests/testkit/ws-protocol.test.cjs
          node load-tests/testkit/ws-protocol.test.cjs
          node --check load-tests/native/run.js
          node --check load-tests/tests/chat-ws-bounded.js
          node --check load-tests/tests/intent-bounded.js
          node --check load-tests/tests/intent-arrival-probe.js
          node --check load-tests/tests/intent-rate-parity-candidate.js
          node --check load-tests/tests/intent-independent-arrivals-candidate.js
          node --check load-tests/tests/chat-ws-no-pong-negative.js
          node --check load-tests/native/non-pong-fixture.cjs
          node --check load-tests/artillery/comparator-processor.js
          node --check load-tests/artillery/prepare-bounded-ws.js
          node --check load-tests/artillery/ws-bounded-processor.js
          node --check load-tests/artillery/ws-bounded-processor.test.cjs
          node load-tests/artillery/ws-bounded-processor.test.cjs
          node --check load-tests/artillery/ws-real-transport.test.cjs
          if SAILS_LOAD_HTTP_TARGET=https://example.com node load-tests/native/run.js intent > /tmp/load-guard.out 2>&1; then echo 'Unsafe target accepted'; exit 1; fi
          grep -q 'Unsupported target protocol' /tmp/load-guard.out
          if SAILS_LOAD_HTTP_TARGET=http://example.com node load-tests/native/run.js intent > /tmp/load-host-guard.out 2>&1; then echo 'Nonlocal HTTP host accepted'; exit 1; fi
          grep -q 'restricted to loopback targets' /tmp/load-host-guard.out
          if SAILS_LOAD_WS_TARGET=wss://example.com node load-tests/native/run.js ws > /tmp/ws-guard.out 2>&1; then echo 'Unsafe WS target accepted'; exit 1; fi
          grep -q 'Unsupported target protocol' /tmp/ws-guard.out
          if SAILS_LOAD_WS_TARGET=ws://example.com node load-tests/native/run.js ws > /tmp/ws-host-guard.out 2>&1; then echo 'Nonlocal WS host accepted'; exit 1; fi
          grep -q 'restricted to loopback targets' /tmp/ws-host-guard.out
          if SAILS_LOAD_HTTP_TARGET=http://user:password@localhost:3000 node load-tests/native/run.js intent > /tmp/credential-guard.out 2>&1; then echo 'Embedded credentials accepted'; exit 1; fi
          grep -q 'Target URL must not contain credentials' /tmp/credential-guard.out
          if SAILS_LOAD_HTTP_TARGET=http://localhost:3000/other node load-tests/native/run.js smoke > /tmp/path-guard.out 2>&1; then echo 'Target path accepted'; exit 1; fi
          grep -q 'Target URL must not contain path, query or fragment' /tmp/path-guard.out
          if SAILS_LOAD_WS_TARGET=ws://localhost:3000/?ticket=secret node load-tests/native/run.js smoke > /tmp/query-guard.out 2>&1; then echo 'Target query accepted'; exit 1; fi
          grep -q 'Target URL must not contain path, query or fragment' /tmp/query-guard.out
          node -e "require('node:assert/strict').equal(typeof WebSocket,'function')"
          # Native scheduler/session-pool modes retired. Target guards above
          # and real authenticated smoke below remain mandatory.
      - name: Install dependencies with existing script policy (fail closed)
        run: npm ci --no-audit --no-fund
      - name: Validate comparator exports after dependency installation
        run: node -e "const p=require('./load-tests/artillery/comparator-processor.js');if(typeof p.setupCurrentAuthenticatedUser!=='function')process.exit(1);const w=require('./load-tests/artillery/ws-bounded-processor.js');if(typeof w.connectWithFreshTicket!=='function'||typeof w.assertPongFromSocket!=='function')process.exit(1)"
      - name: Fail-closed WebSocket PONG assertion unit proofs
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {EventEmitter} = require('node:events');
          const {assertPongFromSocket} = require('./load-tests/artillery/ws-bounded-processor.js');
          const fake = () => { const ws=new EventEmitter();ws.send=()=>{};return ws; };
          (async()=>{
            const good=fake();const ok=assertPongFromSocket(good,{timeoutMs:100});
            good.emit('message',JSON.stringify({type:'PONG'}));await ok;
            const malformed=fake();const malformedResult=assertPongFromSocket(malformed,{timeoutMs:20});
            malformed.emit('message',JSON.stringify({type:'PING'}));
            await assert.rejects(malformedResult,/PONG timeout/);
            assert.throws(()=>assertPongFromSocket(fake(),{timeoutMs:30001}),/Invalid bounded PONG timeout/);
            const missing=fake();await assert.rejects(assertPongFromSocket(missing,{timeoutMs:15}),/PONG timeout/);
            const bad=fake();const rejected=assertPongFromSocket(bad,{timeoutMs:100});
            bad.emit('message',JSON.stringify({type:'ERROR'}));await assert.rejects(rejected,/application ERROR/);
            const closed=fake();const early=assertPongFromSocket(closed,{timeoutMs:100});
            closed.emit('close');await assert.rejects(early,/closed before PONG/);
            console.log('PONG assertion primitive: positive, wrong-type, timeout bounds, timeout, ERROR, early-close PASS');
          })().catch(()=>process.exit(1));
          NODE
      - name: Fail-closed WS session-pool negative proof
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {connectWithFreshTicket}=require('./load-tests/artillery/ws-bounded-processor.js');
          const root=path.join(process.cwd(),'load-tests/artillery');
          const file=path.join(root,'bounded-ws-users.json');
          const test=()=>new Promise(resolve=>{
            connectWithFreshTicket({}, {}, err=>resolve(err));
          });
          (async()=>{
            assert.equal(fs.existsSync(file),false,'No stale session pool permitted');
            fs.writeFileSync(file,'[{"sessionToken":"test-only"}]',{mode:0o644,flag:'wx'});
            try {
              assert.match((await test()).message,/Bounded WS ticket setup failed/);
            } finally {fs.unlinkSync(file);}
            fs.writeFileSync(file,'[{}]',{mode:0o600,flag:'wx'});
            try {
              assert.match((await test()).message,/Bounded WS ticket setup failed/);
            } finally {fs.unlinkSync(file);}
            fs.writeFileSync(file,'[{"sessionToken":"test-only"}]',{mode:0o600,flag:'wx'});
            const link=path.join(root,'bounded-ws-users-symlink-target.json');
            try {
              fs.renameSync(file,link);
              fs.symlinkSync(link,file);
              assert.match((await test()).message,/Bounded WS ticket setup failed/);
            } finally {
              fs.rmSync(file,{force:true});
              fs.rmSync(link,{force:true});
            }
            console.log('WS session-pool permissions, malformed-schema, symlink negatives PASS (no network requests)');
          })().catch(()=>process.exit(1));
          NODE
      - name: Inspect installed Artillery WS receive assertion surface
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const roots=['node_modules/@artilleryio/engine-ws','node_modules/artillery/node_modules/@artilleryio/engine-ws','node_modules/artillery-engine-ws'];
          const matches=[];
          for(const root of roots){
            if(!fs.existsSync(root))continue;
            const walk=(dir,depth)=>{
              if(depth>5)return;
              for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
                const full=path.join(dir,ent.name);
                if(ent.isDirectory())walk(full,depth+1);
                else if(ent.isFile()&&/\\.(js|mjs|cjs)$/.test(ent.name)){
                  const source=fs.readFileSync(full,'utf8');
                  for(const word of ['receive','expect','onMessage','message']){
                    if(source.includes(word))matches.push(path.relative('.',full)+':'+word);
                  }
                }
              }
            };
            walk(root,0);
          }
          console.log('Installed WS engine receive-related source locations (paths only):',JSON.stringify(matches.slice(0,40)));
          console.log('Inspection is diagnostic, not proof of an assertion hook');
          NODE
      - name: Identify resolved Artillery WS engine package
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const pkg=require('./node_modules/artillery/package.json');
          const deps={...pkg.dependencies,...pkg.optionalDependencies};
          console.log('Artillery version:',pkg.version);
          console.log('WS-related dependency names:',Object.keys(deps).filter(x=>/ws|websocket|engine/i.test(x)).sort().join(',')||'(none)');
          const candidates=['@artilleryio/engine-ws','artillery-engine-ws','ws'];
          for(const name of candidates){
            try{
              const resolved=require.resolve(name,{paths:[path.resolve('node_modules/artillery'),process.cwd()]});
              console.log('Resolved module:',name,path.relative(process.cwd(),resolved));
            }catch{console.log('Module not directly resolvable:',name);}
          }
          const dirs=['node_modules/artillery/lib','node_modules/artillery/dist','node_modules/@artilleryio'];
          for(const dir of dirs)if(fs.existsSync(dir))console.log('Present package directory:',dir);
          NODE
      - name: Prove PONG and no-PONG over real disposable WebSocket transport
        shell: bash
        run: |
          node load-tests/artillery/ws-real-transport.test.cjs
      - name: Validate bounded process CPU and RSS sampler
        shell: bash
        run: |
          node load-tests/native/process-resource-sampler.test.cjs
          node load-tests/native/measured-generator.test.cjs
      - name: Inspect bundled Artillery WebSocket engine implementation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const artilleryEntry=require.resolve('artillery');
          const artilleryRoot=path.dirname(require.resolve('artillery/package.json'));
          const roots=[path.join(artilleryRoot,'dist'),path.join(artilleryRoot,'lib')];
          if(!roots.some(root=>fs.existsSync(root)))throw Error('Artillery compiled implementation not found');
          console.log('Resolved Artillery entry relative path:',path.relative('.',artilleryEntry));
          console.log('Resolved Artillery package root:',path.relative('.',artilleryRoot));
          const matches=[];
          const maxFiles=6000;
          let scanned=0;
          function walk(dir,depth){
            if(depth>8||scanned>=maxFiles)return;
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(scanned>=maxFiles)return;
              const full=path.join(dir,ent.name);
              if(ent.isDirectory())walk(full,depth+1);
              else if(ent.isFile()&&/\.(js|cjs|mjs)$/.test(ent.name)){
                scanned++;
                const src=fs.readFileSync(full,'utf8');
                const lines=src.split('\n');
                for(let i=0;i<lines.length;i++){
                  const line=lines[i];
                  if(line.includes('engine-ws')||line.includes('WebSocketEngine')||line.includes('ws.on(')||line.includes('ws.once(')){
                    matches.push({file:path.relative('.',full),line:i+1,kind:/engine-ws|WebSocketEngine/.test(line)?'engine-reference':'socket-reference'});
                  }
                }
              }
            }
          }
          for(const root of roots)if(fs.existsSync(root))walk(root,0);
          console.log('Artillery bundled WS implementation source references (paths and line numbers only):',JSON.stringify(matches.slice(0,60)));
          console.log('Scanned JavaScript files:',scanned,'total matches:',matches.length);
          if(scanned===0)throw Error('Artillery implementation inspection scanned zero files');
          const wsEngine=path.join(artilleryRoot,'dist/lib/core/engine_ws.js');
          if(!fs.existsSync(wsEngine))throw Error('Resolved Artillery WebSocket engine source missing');
          const engineLines=fs.readFileSync(wsEngine,'utf8').split('\n');
          const interesting=/\.on\(|\.once\(|ping|pong|message|WebSocket/i;
          const bounded=engineLines.flatMap((line,i)=>interesting.test(line)?[{line:i+1,text:line.trim().slice(0,180)}]:[]).slice(0,80);
          console.log('Artillery WS engine bounded event/messaging source inspection:',JSON.stringify(bounded));
          const engineSource=engineLines.join('\n');
          const engineContract={
            replaceableWebSocketDependency:engineSource.includes('export const _deps = { WebSocket };'),
            constructsFromDependency:engineSource.includes('new _deps.WebSocket('),
            applicationMessageHandler:engineSource.includes('context.ws.onmessage = getMessageHandler('),
            explicitPongListener:/\.on\(['"]pong['"]/.test(engineSource)||/\.once\(['"]pong['"]/.test(engineSource)
          };
          // Bounded source evidence for the receive-step contract. Never log
          // complete processor contexts, socket targets or bearer-capability URLs.
          const handlerStart=engineLines.findIndex(line=>line.includes('function getMessageHandler('));
          if(handlerStart<0)throw Error('Artillery receive handler missing');
          // The engine uses a nested function declaration: stop at the
          // first top-level closing brace, not the next top-level function.
          const handlerEnd=engineLines.findIndex((line,i)=>i>handlerStart&&line==='}');
          if(handlerEnd<0)throw Error('Artillery receive handler closing brace missing');
          const handler=engineLines.slice(handlerStart,handlerEnd+1);
          const receiveTokens=[...new Set(handler.flatMap(line=>[...line.matchAll(/\\b(match|capture|timeout|callback|params\\.[a-zA-Z_]+)\\b/g)].map(m=>m[0])))].sort();
          console.log('Artillery receive handler bounded contract:',JSON.stringify({startLine:handlerStart+1,lineCount:handler.length,tokens:receiveTokens}));
          // Emit only source line numbers and redacted code structure. A plain
          // word-boundary token scan can miss params?.match or bracket access.
          const receiveSignals=handler.flatMap((line,i)=>/match|capture|timeout|callback|params|expect|JSON\.parse|emit\(/i.test(line)?[{line:handlerStart+i+1,source:line.trim().slice(0,160)}]:[]);
          console.log('Artillery receive handler bounded structural signals:',JSON.stringify(receiveSignals.slice(0,36)));
          if(handler.length<10||handler.length>180)throw Error('Unexpected Artillery receive handler size; manual review required');
          console.log('Artillery WS transport extension contract:',JSON.stringify(engineContract));
          if(!engineContract.replaceableWebSocketDependency||!engineContract.constructsFromDependency)throw Error('Artillery WebSocket dependency injection contract changed');
          console.log('Diagnostic only: no assertion hook or PONG parity inferred');
          NODE
      - name: Bound Artillery candidate scope and prevent false WS parity
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const yaml=require('yaml');
          const root='load-tests/artillery/';
          const http=yaml.parse(fs.readFileSync(root+'intent-api-bounded-comparator.yml','utf8'));
          const ws=yaml.parse(fs.readFileSync(root+'chat-ws-bounded-comparator.yml','utf8'));
          for(const [name,cfg] of [['HTTP',http],['WS',ws]]){
            assert.equal(cfg.config.phases.length,1,name+' single phase');
            assert.equal(cfg.config.phases[0].duration,2,name+' bounded duration');
            assert.equal(cfg.config.phases[0].arrivalRate,1,name+' bounded rate');
            assert.equal(cfg.config.target,(name==='HTTP'?'http':'ws')+'://127.0.0.1:3000',name+' loopback only');
          }
          assert.equal(http.scenarios.length,1,'one HTTP scenario');
          assert.equal(ws.scenarios.length,1,'one WS scenario');
          assert.equal(http.scenarios[0].flow.length,3,'exact HTTP flow length');
          assert.equal(ws.scenarios[0].flow.length,2,'exact WS flow length');
          assert.equal(http.scenarios[0].flow[0].function,'setupCurrentAuthenticatedUser');
          assert.equal(ws.scenarios[0].flow[0].connect.function,'connectWithFreshTicket');
          assert.equal(ws.scenarios[0].flow[1].send.payload,JSON.stringify({type:'PING',payload:{}}));
          assert.deepEqual(ws.scenarios[0].flow[1].send.match,[{json:'$.type',value:'PONG',strict:true}]);
          assert.equal(ws.scenarios[0].flow[1].send.response.timeout,2);
          assert.equal(http.scenarios[0].flow[1].post.url,'/v1/intents');
          assert.equal(http.scenarios[0].flow[2].delete.url,'/v1/intents/{{ intentId }}');
          assert.deepEqual(http.scenarios[0].flow[1].post.expect,[{statusCode:201}]);
          assert.deepEqual(http.scenarios[0].flow[2].delete.expect,[{statusCode:200}]);
          assert.match(ws.scenarios[0].name,/strict application PONG match/);
          console.log('Artillery candidate bounds and strict PONG match configuration PASS; authenticated parity pending');
          NODE
      - name: Verify Artillery WS engine assertion integration boundary
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const yaml=require('yaml');
          const ws=yaml.parse(fs.readFileSync('load-tests/artillery/chat-ws-bounded-comparator.yml','utf8'));
          const flow=ws.scenarios[0].flow;
          assert.equal(flow[0].connect.function,'connectWithFreshTicket');
          const processor=require('./load-tests/artillery/ws-bounded-processor.js');
          assert.equal(typeof processor.assertPongFromSocket,'function');
          // This intentionally blocks promotion until an engine-supported PONG
          // assertion is integrated and exercised against a nonresponding server.
          const wired=flow.some(step=>step?.function==='assertPongFromSocket'||step?.send?.function==='assertPongFromSocket');
          assert.equal(wired,false,'Candidate unexpectedly changed: review WS engine hook and negative proof before enabling');
          console.log('WS engine match configured; authenticated end-to-end parity and independent review still blocked');
          NODE
      - name: Characterize Artillery silent WebSocket false positive on disposable loopback
        run: node load-tests/artillery/ws-engine-silent-control.test.cjs
      - name: Experiment with Artillery in-engine PONG match on disposable loopback
        run: node load-tests/artillery/ws-engine-match-control.test.cjs
      - name: Generate Prisma client and build
        run: |
          npx prisma generate
          npm run build
      - name: Real-service smoke with disposable PostgreSQL and Redis
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
          SAILS_LOAD_HTTP_TARGET: http://127.0.0.1:3000
          SAILS_LOAD_WS_TARGET: ws://127.0.0.1:3000
        shell: bash
        run: |
          set -euo pipefail
          npm run db:migrate
          node dist/src/main.js > /tmp/sails-native-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then echo 'API exited during startup'; exit 1; fi
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo 'API readiness timeout'; exit 1; fi
          timeout 90s node load-tests/native/run.js smoke
      - name: Execute bounded Artillery HTTP comparator against disposable backend
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
        shell: bash
        run: |
          set -euo pipefail
          # Native protocol smoke already ran. Let the default auth
          # rate-limit window expire instead of weakening production limits.
          sleep 65
          node dist/src/main.js > /tmp/sails-artillery-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then echo 'Artillery comparator API exited'; exit 1; fi
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo 'Artillery comparator API readiness timeout'; exit 1; fi
          export SAILS_BACKEND_PID="$server_pid"
          # Verify the runner's actual Linux page size before interpreting
          # /proc/<pid>/statm and /proc/<pid>/stat resident page counters.
          page_bytes="$(getconf PAGESIZE)"
          if [ "$page_bytes" != "4096" ]; then
            echo 'Unsupported Linux process page size for RSS sampling'
            exit 1
          fi
          export SAILS_PROC_PAGE_KIB=4
          node <<'RESOURCE_NODE'
          const {runMeasured}=require('./load-tests/native/measured-generator.cjs');
          const {observe}=require('./load-tests/native/process-resource-sampler.cjs');
          observe(Number(process.env.SAILS_BACKEND_PID),()=>runMeasured('./node_modules/.bin/artillery',[
            'run','load-tests/artillery/intent-api-bounded-comparator.yml',
            '--output','/tmp/sails-artillery-bounded-http.json'
          ],{timeoutMs:90000,intervalMs:25}).catch(error=>{
            const category=error?.message;
            const allowed=new Set(['Generator timed out','Generator exited nonzero (output redacted)','Generator terminated by signal','Generator runtime error','Generator spawn failed','Generator resource sample count insufficient','Generator resource counters invalid','Generator resource sampling read error: permission','Generator resource sampling read error: io','Generator resource sampling read error: cpu-incomplete','Generator resource sampling read error: rss-incomplete','Generator resource sampling read error: rss-live-no-positive','Generator resource sampling read error: rss-state-changed','Generator resource sampling read error: malformed','Generator resource sampling read error: other']);
            throw Error('Generator: '+(allowed.has(category)?category:'Unclassified generator failure (details withheld)'));
          }),{intervalMs:25}).then(({value:usage,usage:backend})=>{
            console.log('Artillery HTTP backend bounded resource sample:',JSON.stringify(backend));
            console.log('Artillery HTTP generator resource sample:',JSON.stringify(usage));
          }).catch(error=>{
            const backendCategories=new Map([
              ['Incomplete resource sample','Backend resource sample incomplete'],
              ['Non-monotonic CPU counters','Backend CPU counters non-monotonic'],
              ['Incomplete process RSS counters','Backend RSS counter missing'],
              ['Incomplete process CPU counters','Backend CPU counter missing'],
              ['Process exited during resource sample','Backend process exited during sample'],
              ['Malformed proc stat','Backend process stat malformed']
            ]);
            const category=typeof error?.message==='string' ? error.message : '';
            console.error('Artillery HTTP failure category:',category.startsWith('Generator: ')?category:backendCategories.get(category)||'Unclassified backend observation failure (details withheld)');
            process.exitCode=1;
          });
          RESOURCE_NODE
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('/tmp/sails-artillery-bounded-http.json','utf8'));
          const counters=report.aggregate?.counters||{};
          const completed=counters['vusers.completed']||0;
          const failed=counters['vusers.failed']||0;
          const errors=Object.entries(counters).filter(([k,v])=>/(errors\\.|failed|unexpected_response)/.test(k)&&Number(v)>0);
          assert.equal(completed,2,'Exactly two HTTP comparator virtual users must complete');
          assert.equal(failed,0,'No failed virtual users');
          assert.equal(counters['http.requests'],4,'Exactly four HTTP create/cancel requests expected (auth PoP setup is out-of-band)');
          assert.equal(counters['sails.auth_setup_started'],2,'Exactly two observed Artillery auth setup starts required');
          assert.equal(counters['sails.intent_create_responses'],2,'Exactly two instrumented Artillery create responses required');
          assert.equal(counters['sails.intent_cancel_responses'],2,'Exactly two instrumented Artillery cancel responses required');
          console.log('Artillery HTTP independently instrumented response counts:',JSON.stringify({
            create:counters['sails.intent_create_responses'],
            cancel:counters['sails.intent_cancel_responses'],
            verified:true,
            measurement:'afterResponse callback, separate from plugin endpoint counters'
          }));
          // Audit availability of endpoint-scoped request counters; these are
          // NOT enforced because this Artillery runner has not emitted them.
          // Authentication occurs outside the in-engine HTTP metrics.
          const endpointRequestCounters=Object.entries(counters).filter(([key])=>
            /plugins\\.metrics-by-endpoint\\.codes\\./.test(key)||/plugins\\.metrics-by-endpoint\\.requests\\./.test(key));
          // Endpoint histograms exist, but histogram sample counts are not
          // equivalent to separately instrumented HTTP request counters.
          // Do not infer endpoint counts from medians or global totals.
          const endpointRequestCounterCoverage={
            matchingCounterKeys:endpointRequestCounters.map(([key])=>key),
            scopedRequestCountersAvailable:endpointRequestCounters.length>0,
            scopedRequestCountParityEstablished:false,
            globalIntentRequests:counters['http.requests']??null
          };
          console.log('Artillery HTTP endpoint request counter coverage:',JSON.stringify(endpointRequestCounterCoverage));

          assert.equal(errors.length,0,'No Artillery error counters');
          const histograms=report.aggregate?.histograms||{};
          const startHistogram=histograms['sails.auth_setup_start_epoch_ms'];
          // Diagnose whether Artillery actually exports the timestamp samples.
          // Two hook invocations alone cannot establish measured arrival spacing.
          // Artillery's HDR histogram median is unreliable for epoch-scale values;
          // only min/max and independently counted hook invocations are diagnostic.
          // Never treat a median outside the observed range as arrival evidence.
          console.log('Artillery observed setup timestamp evidence:',JSON.stringify({
            emittedStarts:counters['sails.auth_setup_started']??null,
            histogramAvailable:Boolean(startHistogram),
            histogramCount:Number.isFinite(startHistogram?.count)?startHistogram.count:null,
            medianEpochMs:null,
            medianExcludedReason:'epoch-scale histogram quantile is not reliable',
            minEpochMs:Number.isFinite(startHistogram?.min)?startHistogram.min:null,
            maxEpochMs:Number.isFinite(startHistogram?.max)?startHistogram.max:null,
            observedSpanMs:Number.isFinite(startHistogram?.min)&&Number.isFinite(startHistogram?.max)?startHistogram.max-startHistogram.min:null,
            spacingEstablished:false,
            schedulerArrivalParityEstablished:false
          }));
          const latencyNames=Object.keys(histograms).filter(k=>/response_time|latency|duration/.test(k));
          const latency=Object.fromEntries(latencyNames.map(k=>{
            const h=histograms[k]||{};
            return [k,Object.fromEntries(['median','p50','p95','p99'].filter(q=>typeof h[q]==='number'&&Number.isFinite(h[q])).map(q=>[q,h[q]]))];
          }));
          console.log('Artillery HTTP sanitized metrics:',JSON.stringify({
            completed,failed,errors:errors.length,
            httpRequests:counters['http.requests']??null,
            latencyMs:latency
          }));
          assert.ok(latencyNames.length>0,'Artillery HTTP latency histogram missing');
          assert.ok(latencyNames.some(k=>Object.keys(latency[k]).length>0),'Artillery HTTP latency quantiles missing');
          // The comparison is meaningless if one operation silently loses its
          // endpoint-specific histogram. Reject missing or non-finite quantiles.
          const endpointKeys=latencyNames.filter(k=>/metrics-by-endpoint.*response_time/.test(k));
          const createKeys=endpointKeys.filter(k=>/\/v1\/intents$/.test(k));
          const cancelKeys=endpointKeys.filter(k=>/\/v1\/intents\//.test(k));
          assert.ok(createKeys.length>0,'Artillery create endpoint histogram missing');
          assert.ok(cancelKeys.length>0,'Artillery cancel endpoint histogram missing');
          // Preserve sanitized, per-operation Artillery quantiles for later
          // cross-engine review. Do not claim temporal or latency parity.
          const endpointLatency={
            create:latency[createKeys[0]],
            cancel:latency[cancelKeys[0]]
          };
          // Artillery's aggregate endpoint histograms may have only two samples;
          // these quantiles are descriptive, not a statistical parity test.
          console.log('Artillery HTTP latency comparison limitations:',JSON.stringify({
            temporalParityEstablished:false,
            latencyParityEstablished:false,
            sampleCountPerEndpointExpected:2,
            authRequestsIncludedInArtilleryHttpMetrics:false,
            requestTimingBoundaryEquivalenceEstablished:false,
            generatorResourceSamplingWindowsEquivalent:false
          }));
          console.log('Artillery HTTP endpoint latency evidence:',JSON.stringify({
            arrivalRatePerSecond:1,configuredWindowSeconds:2,
            temporalParityEstablished:false,
            endpointLatency
          }));
          for(const [operation,keys] of [['create',createKeys],['cancel',cancelKeys]]){
            assert.ok(keys.every(k=>{const v=latency[k];return ['median','p95','p99'].every(q=>Number.isFinite(v?.[q])&&v[q]>=0)&&v.median<=v.p95&&v.p95<=v.p99;}),
              'Artillery '+operation+' endpoint median/p95/p99 missing');
          }
          NODE
      - name: Execute bounded Artillery WS candidate against disposable backend
        env:
          NODE_ENV: development
