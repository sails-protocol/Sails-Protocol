          // Show a bounded, redacted loader error so the root cause is actionable.
          const sanitized=log.split(/\r?\n/).filter(line=>/level=error|ERRO\[|error=|no such file|could not|failed to/i.test(line))
            .slice(0,5).map(line=>line.slice(0,600)
              .replace(/https?:\/\/\S+/g,'[URL]')
              .replace(/(?:token|authorization|secret|password)=\S+/gi,'[REDACTED]'));
          console.log('k6 offline crypto loader errors:',JSON.stringify(sanitized));
          // This fixture has no credentials or network calls. Emit only the
          // allowlisted, literal module-resolution error, never a raw log line.
          const allowed=[
            'The moduleSpecifier "../../node_modules/tweetnacl/nacl-fast.js" couldn\'t be found on local disk.',
            'GoError: The moduleSpecifier "../../node_modules/tweetnacl/nacl-fast.js" couldn\'t be found on local disk.',
          ];
          console.log('k6 preflight known module error:',allowed.some(msg=>log.includes(msg)));
