      - name: Execute opt-in bounded authenticated arrival probe
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
        shell: bash
        run: |
          set -euo pipefail
          # Isolate rate-limit windows from prior Intent/WS authentication.
          sleep 65
          node dist/src/main.js > /tmp/sails-k6-probe-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then echo 'Arrival probe backend exited'; exit 1; fi
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo 'Arrival probe backend readiness timeout'; exit 1; fi
          if ! timeout 45s k6 run --quiet --summary-export=/tmp/sails-k6-arrival-summary.json -e BASE_URL=http://127.0.0.1:3000 load-tests/tests/intent-arrival-probe.js > /tmp/sails-k6-arrival.log 2>&1; then
            # Never echo raw logs: they can contain bearer credentials.
            echo 'Bounded authenticated arrival probe failed (raw logs withheld)'
            exit 1
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('/tmp/sails-k6-arrival-summary.json','utf8')).metrics||{};
          const required=['iterations','checks','sails_intent_success','http_req_duration','http_reqs','dropped_iterations'];
          const missing=required.filter(k=>!m[k]);
          const n=k=>typeof m[k]?.count==='number'?m[k].count:undefined;
          const checks=m.checks?.value;
          const success=m.sails_intent_success?.value;
          const quantiles=['med','p(95)','p(99)'].filter(k=>typeof m.http_req_duration?.[k]==='number'&&Number.isFinite(m.http_req_duration[k]));
          const durations=Object.fromEntries(quantiles.map(k=>[k,m.http_req_duration[k]]));
          const requestCount=n('http_reqs');
          const arrivals=n('iterations');
          // Each arrival performs four PoP auth HTTP calls and two Intent calls.
          // Reject missing/extra requests rather than silently treating auth as unmeasured.
          const expectedRequestsPerArrival=6;
          const requestedRatePerSecond=1;
          const scheduledWindowSeconds=2;
          const achievedRatePerSecond=arrivals/scheduledWindowSeconds;
          const nominalScheduledArrivals=requestedRatePerSecond*scheduledWindowSeconds;
          const intentDurationKeys=['sails_intent_create_duration','sails_intent_cancel_duration'];
          const intentDurations=Object.fromEntries(intentDurationKeys.filter(k=>m[k]).map(k=>[k,Object.fromEntries(['med','p(95)','p(99)'].filter(q=>typeof m[k][q]==='number'&&Number.isFinite(m[k][q])).map(q=>[q,m[k][q]]))]));
          console.log('arrival probe sanitized inventory:',JSON.stringify({
            requiredPresent:required.filter(k=>!!m[k]),missing,
            iterations:arrivals,dropped:n('dropped_iterations'),httpRequests:requestCount,
            expectedRequestsPerArrival,requestAccountingValid:requestCount===arrivals*expectedRequestsPerArrival,
            requestedRatePerSecond,scheduledWindowSeconds,nominalScheduledArrivals,achievedRatePerSecond,
            durationMs:durations,intentDurationMs:intentDurations,
            checksValid:checks===1,intentSuccessValid:success===1,
            durationQuantilesPresent:quantiles
          }));
          if(missing.length||!(arrivals>0)||requestCount!==arrivals*expectedRequestsPerArrival||n('dropped_iterations')!==0||checks!==1||success!==1||quantiles.length!==3||intentDurationKeys.some(k=>Object.keys(intentDurations[k]||{}).length!==3)){
            throw Error('Bounded arrival probe missing or invalid aggregate evidence');
          }
          NODE
