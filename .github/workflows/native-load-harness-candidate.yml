          assert.equal(counters['websocket.messages_sent']||0,2,'Exactly two authenticated WS PING frames required');
          const errors=Object.entries(counters).filter(([k,v])=>['errors.','websocket.errors','http.errors'].some(prefix=>k.startsWith(prefix))&&Number(v)>0);
          assert.equal(errors.length,0,'No Artillery WS candidate error counters');
          console.log('Bounded authenticated Artillery WS candidate: 2 PONG matches, 0 failed VUs, 0 errors; independent parity review pending');
          NODE
