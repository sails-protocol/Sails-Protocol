              console.log('k6 rate candidate failure fingerprints:',JSON.stringify(fingerprints));
              const summaryPath='/tmp/sails-k6-rate-summary.json';
              if(fs.existsSync(summaryPath)){
                const m=JSON.parse(fs.readFileSync(summaryPath,'utf8')).metrics||{};
                const count=k=>m[k]?.count??null;
                console.log('k6 rate candidate failure counters:',JSON.stringify({
                  iterations:count('iterations'),authenticated:count('sails_authenticated_arrivals'),
                  completed:count('sails_completed_intent_pairs'),create:count('sails_intent_create_samples'),
                  cancel:count('sails_intent_cancel_samples'),requests:count('http_reqs'),
                  dropped:count('dropped_iterations'),extraScheduledArrivals:count('sails_extra_scheduled_arrivals')??0,
                  timestampSamples:count('sails_observed_setup_timestamp_samples'),
                  timestampCoverageMatchesIterations:count('sails_observed_setup_timestamp_samples')===count('iterations'),
                  observedEntrySpanMs:Number.isFinite(m.sails_observed_setup_start_epoch_ms?.min)&&Number.isFinite(m.sails_observed_setup_start_epoch_ms?.max)?m.sails_observed_setup_start_epoch_ms.max-m.sails_observed_setup_start_epoch_ms.min:null,
                  nominalArrivals:2,arrivalCountMatchesNominal:count('iterations')===2,
                  requestCountMatchesObservedArrivals:count('http_reqs')===6*count('iterations'),checksPass:m.checks?.value===1,
                  intentPass:m.sails_intent_success?.value===1,httpFailureRate:m.http_req_failed?.value??null
                }));
              }
            }
            process.exitCode=1;
          });
          RESOURCE_NODE
          node <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('/tmp/sails-k6-rate-summary.json','utf8')).metrics||{};
          const count=k=>m[k]?.count;
          const keys=['iterations','sails_authenticated_arrivals','sails_completed_intent_pairs','sails_intent_create_samples','sails_intent_cancel_samples'];
          const observed=Object.fromEntries(keys.map(k=>[k,count(k)??null]));
          const assert=require('node:assert/strict');
          const observedTiming=m['sails_observed_setup_start_epoch_ms'];
          const observedMin=observedTiming?.min;
          const observedMax=observedTiming?.max;
          assert.ok(Number.isFinite(observedMin)&&Number.isFinite(observedMax)&&observedMax>=observedMin,
            'k6 observed setup timestamp trend missing or invalid');
          const observedIterations=count('iterations');
          // This trend must cover every invocation, including rejected boundary extras.
          // A matching range with missing samples would be misleading evidence.
          assert.ok(Number.isSafeInteger(count('sails_observed_setup_timestamp_samples'))&&count('sails_observed_setup_timestamp_samples')===observedIterations,
            'k6 observed timestamp sample count must equal actual iterations');
          console.log('k6 observed iteration entry timestamp evidence:',JSON.stringify({
            minEpochMs:observedMin,maxEpochMs:observedMax,
            observedSpanMs:observedMax-observedMin,
            timestampSamples:count('sails_observed_setup_timestamp_samples'),
            observedIterations,
            timestampCoverageVerified:true,
            schedulerArrivalParityEstablished:false,
            measurement:'iteration entry, not executor scheduled arrival'
          }));
          const scopedRequestCounts={
            intent_create:count('http_reqs{name:intent_create}')??null,
            intent_cancel:count('http_reqs{name:intent_cancel}')??null
          };
          const scopedRequestEvidenceAvailable=Object.values(scopedRequestCounts).every(n=>Number.isSafeInteger(n));
          // Fail closed if the runner omits scoped submetrics from its summary;
          // never infer endpoint counts from the global 12-request aggregate.
          // An exact two-arrival run must have two independent timestamp samples.
          // Reject missing or surplus samples even when the exported Trend range looks plausible.
          const timestampCoverageValid=count('sails_observed_setup_timestamp_samples')===2&&observedIterations===2;
          const valid=timestampCoverageValid&&keys.every(k=>count(k)===2)&&count('iterations')===2&&count('sails_extra_scheduled_arrivals')===0&&count('http_reqs')===12&&count('dropped_iterations')===0&&m.checks?.value===1&&m.sails_intent_success?.value===1&&scopedRequestEvidenceAvailable&&scopedRequestCounts.intent_create===2&&scopedRequestCounts.intent_cancel===2;
          const quantiles=['med','p(95)','p(99)'];
          const operations=['sails_intent_create_duration','sails_intent_cancel_duration'];
          const latency=Object.fromEntries(operations.map(k=>[k,Object.fromEntries(quantiles.map(q=>[q,m[k]?.[q]??null]))]));
          const validLatency=operations.every(k=>quantiles.every(q=>Number.isFinite(m[k]?.[q])&&m[k][q]>=0)&&m[k].med<=m[k]['p(95)']&&m[k]['p(95)']<=m[k]['p(99)']);
          console.log('k6 rate candidate bounded aggregate:',JSON.stringify({requestedRatePerSecond:1,configuredWindowSeconds:1.999,artilleryWindowSeconds:2,temporalParityEstablished:false,observed,scopedRequestCounts,scopedRequestEvidenceAvailable,extraScheduledArrivals:count('sails_extra_scheduled_arrivals')??0,requests:count('http_reqs')??null,dropped:count('dropped_iterations')??null,latency,valid,validLatency}));
          if(!valid||!validLatency)throw Error('Rate candidate schedule or per-operation evidence not comparable');
          console.log('Rate candidate k6 shape PASS; cross-engine parity NOT established');
          NODE
      - name: Exercise independent-start Intent candidate against disposable loopback backend
        if: always()
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
        shell: bash
        run: |
          set -euo pipefail
          # Separate the auth budget from previous tests; never bypass rate limits.
          sleep 65
          node dist/src/main.js > /tmp/sails-independent-intent-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then echo 'Independent Intent backend exited'; exit 1; fi
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1 || { echo 'Independent Intent backend readiness timeout'; exit 1; }
          # Presence checks separate checkout/toolchain loss from k6 parse errors.
          # Print booleans only; no filesystem paths or stderr.
          test -f load-tests/tests/intent-independent-arrivals-candidate.js && script_present=1 || script_present=0
          command -v k6 >/dev/null 2>&1 && k6_present=1 || k6_present=0
          test -f load-tests/k6.config.js && config_present=1 || config_present=0
          echo "Independent Intent preflight presence: script=$script_present config=$config_present k6=$k6_present"
          # Validate direct imports and filesystem context without disclosing paths.
          test -f load-tests/tests/intent-creation.js && intent_import=1 || intent_import=0
          test -f load-tests/utils/data-generator.js && generator_import=1 || generator_import=0
          test -d /tmp && test -w /tmp && temp_writable=1 || temp_writable=0
          echo "Independent Intent import presence: intent=$intent_import generator=$generator_import tempWritable=$temp_writable"
          test "$intent_import" -eq 1 && test "$generator_import" -eq 1 && test "$temp_writable" -eq 1 || {
            echo 'Independent Intent import or temporary-directory prerequisite absent'
            exit 1
          }
          test "$script_present" -eq 1 && test "$config_present" -eq 1 && test "$k6_present" -eq 1 || {
            echo 'Independent Intent prerequisite absent; fail closed'
            exit 1
          }
          # Preflight parses and initializes the script without issuing HTTP requests.
          # Only the exit status is emitted; stderr can contain sensitive config.
          set +e
          k6 inspect -e BASE_URL=http://127.0.0.1:3000 \
            load-tests/tests/intent-independent-arrivals-candidate.js > /tmp/sails-independent-intent-inspect.log 2>&1
          inspect_exit=$?
          set -e
          echo "Independent Intent k6 inspect exit code: $inspect_exit"
          if [ "$inspect_exit" -ne 0 ]; then
            node <<'NODE'
          const fs=require('node:fs');
          const log=fs.readFileSync('/tmp/sails-independent-intent-inspect.log','utf8');
          // Fixed booleans only: k6 stderr can contain URLs or credentials.
          const categories={
            unsupportedFlag:/unknown flag|unknown shorthand flag|flag provided but not defined/i.test(log),
            usage:/usage:|available commands:/i.test(log),
            invalidArgument:/accepts? [0-9]+ arg|requires? (an? )?argument/i.test(log),
            moduleResolution:/could not resolve|unknown module|module not found/i.test(log),
            invalidOptions:/invalid option|invalid configuration/i.test(log),
            javascript:/GoError|TypeError|ReferenceError|SyntaxError/i.test(log)||log.includes('ERRO['),
            // Differentiate Go's own runtime/temporary-file errors from
            // k6 JavaScript module or test-script resolution failures.
            goRuntime:/runtime\/|goroutine |go: |GOMAXPROCS|GOMEMLIMIT/i.test(log),
            tempDirectory:/\/tmp\/|temporary directory|tempdir/i.test(log),
            resourceExhaustion:/too many open files|cannot allocate memory|no space left|resource temporarily unavailable/i.test(log),
            missingFile:/no such file or directory/i.test(log),
            permissionDenied:/permission denied/i.test(log),
            execFormat:/exec format/i.test(log),
            missingScript:log.includes('intent-independent-arrivals-candidate.js')&&/no such file/i.test(log),
            missingDependency:/node_modules|open .*: no such file/i.test(log),
            filesystemPath:/stat |open |lstat /i.test(log),
            executable:/no such file|permission denied|exec format/i.test(log),
            missingBaseUrl:/loopback HTTP target/i.test(log)
          };
          console.log('Independent Intent inspect sanitized diagnostics:',JSON.stringify(categories));
          NODE
            echo 'Independent Intent script preflight failed; no HTTP candidate run attempted'
            exit 1
          fi
          set +e
          timeout 90s k6 run --quiet --out json=/tmp/sails-independent-intent-metrics.json --summary-export=/tmp/sails-independent-intent-summary.json \
            -e BASE_URL=http://127.0.0.1:3000 \
            load-tests/tests/intent-independent-arrivals-candidate.js > /tmp/sails-independent-intent.log 2>&1
          k6_exit=$?
          set -e
          # Record only process-level evidence; never expose raw k6 stderr.
          if [ -f /tmp/sails-independent-intent-metrics.json ]; then
            echo 'Independent Intent metrics file: present'
          else
            echo 'Independent Intent metrics file: absent'
          fi
          if [ -f /tmp/sails-independent-intent-summary.json ]; then
            echo 'Independent Intent summary file: present'
          else
            echo 'Independent Intent summary file: absent'
          fi
          if [ "$k6_exit" -ne 0 ]; then
            echo "Independent Intent runner exit code: $k6_exit"
            if [ "$k6_exit" -eq 124 ]; then echo 'Independent Intent runner exceeded 90s wall-clock bound'; fi
            echo 'Independent Intent candidate failed; raw logs withheld to protect auth data'
            node <<'NODE'
          const fs=require('node:fs');
          const file='/tmp/sails-independent-intent-summary.json';
          const log=fs.readFileSync('/tmp/sails-independent-intent.log','utf8');
          // Extract only numeric, allowlisted k6 metric points. Never print tags,
          // URLs, log lines, response bodies, or auth data.
          const metricsFile='/tmp/sails-independent-intent-metrics.json';
          const safeMetricNames=new Set(['iterations','http_reqs','http_req_failed',
            'sails_authenticated_arrivals','sails_completed_intent_pairs',
            'sails_intent_create_samples','sails_intent_cancel_samples',
            'sails_observed_setup_timestamp_samples','sails_extra_scheduled_arrivals',
            'dropped_iterations']);
          const points={};
          if(fs.existsSync(metricsFile)){
            const records=fs.readFileSync(metricsFile,'utf8').split(String.fromCharCode(10));
            for(const line of records){
              if(!line)continue;
              let entry;try{entry=JSON.parse(line)}catch{continue}
              if(entry.type!=='Point'||!safeMetricNames.has(entry.metric))continue;
              const v=entry.data?.value;
              if(typeof v==='number'&&Number.isFinite(v))
                points[entry.metric]=(points[entry.metric]||0)+v;
            }
          }
          console.log('Independent Intent safe metric points:',JSON.stringify(points));
          const fingerprints={
            authentication:/Rate candidate authentication failed/.test(log),
            runtimeError:/GoError|TypeError|ReferenceError|level=error/.test(log)||log.includes('ERRO['),
            moduleResolution:/could not resolve|unknown module|module not found/i.test(log),
            threshold:/thresholds? on metrics?/i.test(log),
            initialization:/could not initialize|initializing|init context|error while evaluating/i.test(log),
            invalidOptions:/invalid option|invalid configuration|unknown executor/i.test(log),
            connection:/connection refused|connect:|dial tcp/i.test(log),
            rateLimit:/429|rate.limit/i.test(log),
            fatal:/panic:|fatal error:/i.test(log),
            signal:/signal:|interrupted|terminated/i.test(log),
            assertion:/assertion failed|AssertionError/i.test(log)||log.includes('assert.equal'),
            unhandledException:/uncaught|unhandled|exception/i.test(log),
            invalidJson:/unexpected token|invalid json/i.test(log)||log.includes('JSON.parse'),
            networkTimeout:/request timeout|context deadline exceeded|timeout/i.test(log),
            httpStatus:/status code|response status/i.test(log),
            scriptError:/script exception|script execution|error running/i.test(log),
            metricThreshold:/thresholds have failed|thresholds crossed/i.test(log)
          };
          if(fs.existsSync(file)){
            const m=JSON.parse(fs.readFileSync(file,'utf8')).metrics||{};
            const count=k=>m[k]?.count??null;
            const keys=['iterations','sails_authenticated_arrivals','sails_completed_intent_pairs',
              'sails_intent_create_samples','sails_intent_cancel_samples',
              'sails_observed_setup_timestamp_samples','http_reqs',
              'sails_extra_scheduled_arrivals','dropped_iterations'];
            console.log('Independent Intent failure aggregate:',JSON.stringify({
              counts:Object.fromEntries(keys.map(k=>[k,count(k)])),
              checks:m.checks?.value??null,intentSuccess:m.sails_intent_success?.value??null,
              httpFailureRate:m.http_req_failed?.value??null,fingerprints
            }));
          }else console.log('Independent Intent failure aggregate:',JSON.stringify({summaryPresent:false,fingerprints}));
          NODE
            exit 1
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('/tmp/sails-independent-intent-summary.json','utf8')).metrics||{};
          const count=k=>m[k]?.count;
          const required={
            iterations:2,sails_authenticated_arrivals:2,sails_completed_intent_pairs:2,
            sails_intent_create_samples:2,sails_intent_cancel_samples:2,
            sails_observed_setup_timestamp_samples:2,http_reqs:12,
            'http_reqs{name:intent_create}':2,'http_reqs{name:intent_cancel}':2,
            sails_extra_scheduled_arrivals:0,dropped_iterations:0
          };
          const observed=Object.fromEntries(Object.keys(required).map(k=>[k,count(k)??null]));
          const timing=m.sails_observed_setup_start_epoch_ms;
          const span=(timing?.max??NaN)-(timing?.min??NaN);
          console.log('Independent Intent bounded evidence:',JSON.stringify({
            observed,entrySpanMs:Number.isFinite(span)?span:null,
            checks:m.checks?.value??null,intentSuccess:m.sails_intent_success?.value??null,
            httpFailureRate:m.http_req_failed?.value??null,artilleryParityEstablished:false
          }));
          for(const [k,v] of Object.entries(required))assert.equal(count(k),v,'Invalid '+k);
          assert.equal(m.checks?.value,1);
          assert.equal(m.sails_intent_success?.value,1);
          assert.equal(m.http_req_failed?.value,0);
          assert.ok(Number.isFinite(span)&&span>=700&&span<=1300,
            'Independent Intent entry spacing outside experimental bound');
          for(const key of ['sails_intent_create_duration','sails_intent_cancel_duration']){
            const metric=m[key];
            assert.ok(metric,'Missing scoped latency '+key);
            for(const q of ['med','p(95)','p(99)'])
              assert.ok(Number.isFinite(metric[q])&&metric[q]>=0,'Invalid latency '+key+' '+q);
          }
          NODE
