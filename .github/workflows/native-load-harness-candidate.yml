          # even when TweetNaCl's browser WebCrypto branch is selected.
          # Patch ONLY the disposable runner's installed dependency.
          # The source package, lockfile and application remain untouched.
          node <<'NODE'
          const fs=require('node:fs');
          const path='node_modules/tweetnacl/nacl-fast.js';
          const source=fs.readFileSync(path,'utf8');
          const needle="require('crypto')";
          const occurrences=source.split(needle).length-1;
          if(occurrences!==1) throw new Error('Unexpected TweetNaCl crypto import count: '+occurrences);
          const patched=source.replace(needle,'undefined /* k6: browser CSPRNG supplied by globalThis.crypto */');
          if(patched.includes(needle)) throw new Error('Unsupported Node crypto import remains');
          fs.writeFileSync(path,patched);
          console.log('k6-only TweetNaCl Node crypto import neutralized; WebCrypto signing remains required');
          NODE
      - name: Isolate k6 Ed25519 CSPRNG compatibility before authenticated smoke
        shell: bash
        run: |
          set -euo pipefail
          # No credentials or network requests. Distinguish loader failures from
          # secure RNG and Ed25519 signing before starting the real backend.
          cat > load-tests/tests/crypto-preflight.js <<'EOF'
          import { check } from 'k6'
          globalThis.self = globalThis
          const nacl = require('../../node_modules/tweetnacl/nacl-fast.js')
          if (!globalThis.crypto || typeof globalThis.crypto.getRandomValues !== 'function') {
            throw new Error('K6_CRYPTO_PREFLIGHT_WEBCRYPTO_UNAVAILABLE')
          }
          nacl.setPRNG((buffer, length) => {
            for (let i = 0; i < length; i += 65536) {
              globalThis.crypto.getRandomValues(buffer.subarray(i, Math.min(i + 65536, length)))
            }
          })
          export const options = { vus: 1, iterations: 1, thresholds: { checks: ['rate==1'] } }
          export default function () {
            const pair = nacl.sign.keyPair()
            const message = new Uint8Array([83, 97, 105, 108, 115])
            const signature = nacl.sign.detached(message, pair.secretKey)
            check(signature, { 'ed25519 sign and verify': sig => nacl.sign.detached.verify(message, sig, pair.publicKey) })
          }
          EOF
          # Check the actual dependency path before k6 runs; no secret material.
          node <<'NODE'
          const fs=require('node:fs');
          for(const path of ['node_modules/tweetnacl/nacl-fast.js','load-tests/tests/crypto-preflight.js']){
