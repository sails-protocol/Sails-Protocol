name: Production dependency verification

on:
  pull_request:
    branches: [main, security/dependabot-integrated-candidate, security/node24-runtime-validation, security/ci-node24-parity]
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "Dockerfile"
      - ".github/workflows/production-dependency-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: reference

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify checked out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C reference rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install production dependencies cleanly
        working-directory: reference
        run: npm ci --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund --no-progress

      - name: Report physically installed Prisma dependency paths
        working-directory: reference
        run: |
          node <<'NODE'
          const lock = require('./node_modules/.package-lock.json');
          const forbidden = ['prisma', '@prisma/config', 'mysql2', 'deepmerge-ts'];
          const required = ['@prisma/client', '@prisma/adapter-pg', '@prisma/client-runtime-utils', 'pg'];

          let failed = false;
          for (const name of [...forbidden, ...required]) {
            const suffix = `/node_modules/${name}`;
            const matches = Object.entries(lock.packages)
              .filter(([path]) => path === `node_modules/${name}` || path.endsWith(suffix))
              .map(([path, pkg]) => ({ path, version: pkg.version }));
            const physicallyInstalled = matches.length > 0;
            const mustBeInstalled = required.includes(name);
            console.log(JSON.stringify({ name, physicallyInstalled, expected: mustBeInstalled ? 'present' : 'absent', matches }));
            if (physicallyInstalled !== mustBeInstalled) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE

      - name: Audit production dependency graph
        working-directory: reference
        run: |
          set +e
          npm audit --omit=dev --omit=optional --json --no-fund --no-progress > production-audit.json
          audit_status=$?
          set -e
          cat production-audit.json
          exit "$audit_status"

      - name: Preserve production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: reference/production-audit.json
          if-no-files-found: warn
          retention-days: 7
