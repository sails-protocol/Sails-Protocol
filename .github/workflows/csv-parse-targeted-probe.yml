name: CSV parse targeted advisory probe
on:
  push:
    branches: [security/targeted-csv-parse-advisory-probe]
  pull_request:
    branches: [security/ts-node-dev-removal-validated]
permissions:
  contents: read
jobs:
  probe-csv-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Compare isolated csv-parse lockfile update
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --json > csv-parse-baseline-audit.json || true
          npm update csv-parse --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git diff -- package.json package-lock.json > csv-parse-candidate.patch
          npm ci --no-audit --no-fund
          npm audit --json > csv-parse-candidate-audit.json || true
          node <<'NODE'
          const fs=require('fs'), b=JSON.parse(fs.readFileSync('csv-parse-baseline-audit.json')), a=JSON.parse(fs.readFileSync('csv-parse-candidate-audit.json'));
          const before=b.vulnerabilities||{},after=a.vulnerabilities||{};
          const result={baseline:b.metadata?.vulnerabilities,candidate:a.metadata?.vulnerabilities,csvParse:require('./package-lock.json').packages['node_modules/csv-parse']?.version,removed:Object.keys(before).filter(k=>!after[k]),added:Object.keys(after).filter(k=>!before[k]),changed:Object.keys(after).filter(k=>before[k]&&before[k].severity!==after[k].severity)};
          fs.writeFileSync('csv-parse-probe-summary.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csv-parse-targeted-probe
          path: |
            csv-parse-baseline-audit.json
            csv-parse-candidate-audit.json
            csv-parse-probe-summary.json
            csv-parse-candidate.patch
          if-no-files-found: warn
