name: CI Tests
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Missão 11 Fase 6.3B.1 — the real-Postgres integration lane
    # (npm run test:integration:postgres) needs an actual ephemeral test
    # Postgres to run for real instead of failing the fail-closed
    # authorization/connectivity guard. This service container is
    # created fresh per CI run and discarded afterward — never a shared
    # or persistent database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Issue #302 — canonical registration now requires a Redis-backed
      # registration challenge, so every integration test that registers a
      # participant needs a real Redis alongside Postgres.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDISMS_DISABLE_POSTINSTALL: true
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
      # Explicit, deliberate opt-in required by
      # tests/integration/postgresTestHarness.ts's fail-closed guard —
      # this service container is a fresh, disposable, CI-only Postgres,
      # never a shared or production database.
      SAILS_INTEGRATION_TEST_DB_CONFIRMED: yes-i-am-sure
      # M9.10-R root cause: TRUSTED_ARBITRATORS was never set anywhere in
      # this workflow. src/config/index.ts reads it once, at
      # module-import time; when empty, dispute.service.ts's lazy
      # singleton getDisputeService() throws ValidationError on its first
      # call and stays broken for the rest of that worker's process. At
      # least 10 tests/integration/*.test.ts files (and
      # tests/settlementReadAccess.test.ts, fixed separately) assume this
      # var is set — same as every local dev checkout's own gitignored
      # .env already provides (TRUSTED_ARBITRATORS=k6-test-arbiter).
      # Matching that exact value here, rather than patching each
      # affected test file individually, since the dependency is on
      # ambient environment, not on any one file.
      TRUSTED_ARBITRATORS: k6-test-arbiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build workspace packages
        # Mission 9.10 — same real root cause fixed in ci.yml (see that
        # workflow's own comment and docs/TECHNICAL_DEBT_AUDIT.md #49):
        # @satsails/p2p-trading-sdk's package.json "types" field points
        # at dist/ (gitignored), which ts-jest's TypeScript diagnostic
        # pass needs and jest.config.js's moduleNameMapper does not
        # cover. Reproduced locally byte-for-byte before this fix.
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk
      - name: Generate Prisma Client
        # Mission 9.10 — same real root cause fixed in ci.yml (see that
        # workflow's own comment): `npm install` alone never populates
        # @prisma/client's real exports, only `prisma generate` does.
        # Confirmed via this workflow's own jest-output.txt artifact
        # (run 33352899462): 80 of 147 suites failed on
        # `TS2305: Module '@prisma/client' has no exported member ...`.
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run tests (capture output)
        run: |
          set -o pipefail
          npm test 2>&1 | tee jest-output.txt
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-output
          path: jest-output.txt
