name: CI Tests
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# CTO 403 - cancel only the OBSOLETE runs of the same pull request. A pull_request run belongs to the group "<workflow>-pr-<number>":
# a newer run of the same PR replaces an older one still queued or running. Every other event (push to main, schedule, manual
# dispatch) gets a group of its own per run (run_id), so it can never be cancelled, never cancels anything and never queues behind
# another run. Different PRs have different numbers and never share a group. cancel-in-progress is true only for pull_request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Missão 11 Fase 6.3B.1 — the real-Postgres integration lane
    # (npm run test:integration:postgres) needs an actual ephemeral test
    # Postgres to run for real instead of failing the fail-closed
    # authorization/connectivity guard. This service container is
    # created fresh per CI run and discarded afterward — never a shared
    # or persistent database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Issue #302 — canonical registration now requires a Redis-backed
      # registration challenge, so every integration test that registers a
      # participant needs a real Redis alongside Postgres.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDISMS_DISABLE_POSTINSTALL: true
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
      # Explicit, deliberate opt-in required by
      # tests/integration/postgresTestHarness.ts's fail-closed guard —
      # this service container is a fresh, disposable, CI-only Postgres,
      # never a shared or production database.
      SAILS_INTEGRATION_TEST_DB_CONFIRMED: yes-i-am-sure
      # CTO 230 - npm run db:migrate goes through scripts/migrate-deploy-safe.sh. These
      # lanes deliberately migrate and test as the superuser (test setup needs
      # privileged operations), so the legacy single credential is opted into
      # explicitly; the role-segregated path is exercised by runtimePrivileges and
      # by the restricted-runtime lane in ci-tests.yml.
      SAILS_LEGACY_SINGLE_CREDENTIAL: "1"
      # M9.10-R root cause: TRUSTED_ARBITRATORS was never set anywhere in
      # this workflow. src/config/index.ts reads it once, at
      # module-import time; when empty, dispute.service.ts's lazy
      # singleton getDisputeService() throws ValidationError on its first
      # call and stays broken for the rest of that worker's process. At
      # least 10 tests/integration/*.test.ts files (and
      # tests/settlementReadAccess.test.ts, fixed separately) assume this
      # var is set — same as every local dev checkout's own gitignored
      # .env already provides (TRUSTED_ARBITRATORS=k6-test-arbiter).
      # Matching that exact value here, rather than patching each
      # affected test file individually, since the dependency is on
      # ambient environment, not on any one file.
      TRUSTED_ARBITRATORS: k6-test-arbiter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build workspace packages
        # Mission 9.10 — same real root cause fixed in ci.yml (see that
        # workflow's own comment and docs/TECHNICAL_DEBT_AUDIT.md #49):
        # @satsails/p2p-trading-sdk's package.json "types" field points
        # at dist/ (gitignored), which ts-jest's TypeScript diagnostic
        # pass needs and jest.config.js's moduleNameMapper does not
        # cover. Reproduced locally byte-for-byte before this fix.
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk
      - name: Generate Prisma Client
        # Mission 9.10 — same real root cause fixed in ci.yml (see that
        # workflow's own comment): `npm install` alone never populates
        # @prisma/client's real exports, only `prisma generate` does.
        # Confirmed via this workflow's own jest-output.txt artifact
        # (run 33352899462): 80 of 147 suites failed on
        # `TS2305: Module '@prisma/client' has no exported member ...`.
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run tests (capture output)
        run: |
          set -o pipefail
          npm test 2>&1 | tee jest-output.txt
      - name: Critical flows as the restricted runtime role (CTO 225)
        # Re-runs real-Postgres suites for trade, escrow, dispute, reconciliation,
        # event store/projections, idempotency and capabilities with the
        # application connected as sails_runtime (no superuser, owns nothing,
        # least-privilege grants from scripts/db/runtime-grants.sql). Suites that
        # need test-only privileges are left out: eventProjectionClaims (cleanup
        # deleteMany), intentTransitionAtomicity (fault-injection triggers),
        # economicDispositionCooperativeGate (deletes a Dispute row as the attack).
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
          SAILS_MIGRATOR_PASSWORD: ci-migrator-password
          SAILS_RUNTIME_PASSWORD: ci-runtime-password
          MIGRATION_DATABASE_URL: postgresql://sails_migrator:ci-migrator-password@localhost:5432/sails_protocol
        run: |
          set -o pipefail
          node scripts/db/bootstrap-roles.js
          npx prisma db execute --file scripts/db/runtime-grants.sql
          DATABASE_URL=postgresql://sails_runtime:ci-runtime-password@localhost:5432/sails_protocol DB_PRIVILEGE_CHECK=enforce \
            npx jest --runInBand \
              tests/integration/tradeProjectionMonotonicity.test.ts \
              tests/integration/offerIntentIdempotencyUniqueness.test.ts \
              tests/integration/tradeAdmissionAtomicity.test.ts \
              tests/integration/escrowFundingConcurrency.test.ts \
              tests/integration/m9rClaimRecovery.test.ts \
              tests/integration/m9rDispatchRecovery.test.ts \
              tests/integration/atomicDisputeOpening.test.ts \
              tests/integration/disputeSemanticProvenance.test.ts \
              tests/integration/capabilityAuthorityEnforced.test.ts \
              tests/integration/durableProjectionCompletion.test.ts \
              tests/integration/semanticTransitionRecordAtomicity.test.ts \
              tests/integration/settlementResultIntegrity.test.ts \
              2>&1 | tee -a jest-output.txt
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-output
          path: jest-output.txt
