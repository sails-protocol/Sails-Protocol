name: ts-node-dev removal lockfile candidate

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ts-node-dev-removal-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify committed manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if(p.devDependencies?.["ts-node-dev"] || l.packages?.["node_modules/ts-node-dev"] || l.packages?.[""]?.devDependencies?.["ts-node-dev"]) process.exit(1); if(p.scripts.dev!=="node --watch --require ts-node/register/transpile-only src/main.ts" || !p.devDependencies?.["ts-node"]) process.exit(1)'
          npm ci --no-audit --no-fund
          test ! -d node_modules/ts-node-dev
          node --require ts-node/register/transpile-only -e 'const ts=require("typescript"),fs=require("fs"); const out=ts.transpileModule(fs.readFileSync("src/main.ts","utf8"),{compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2020}}).outputText; if(!out.includes("startServer")) process.exit(1)'
      - name: Run full dependency audit without suppressing failure
        shell: bash
        run: |
          npm audit --json > committed-removal-audit.json
      - name: Upload exact-head audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committed-ts-node-dev-removal-audit
          path: committed-removal-audit.json
          if-no-files-found: warn
