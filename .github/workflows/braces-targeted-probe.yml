name: Braces targeted advisory probe
on:
  push:
    branches: [security/targeted-braces-advisory-probe]
  pull_request:
    branches: [security/ts-node-dev-removal-validated]
permissions:
  contents: read
jobs:
  probe-braces:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Compare targeted braces update with raw audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --json > braces-baseline-audit.json || true
          npm update braces --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git diff -- package.json package-lock.json > braces-candidate.patch
          npm ci --no-audit --no-fund
          npm audit --json > braces-candidate-audit.json || true
          node <<'NODE'
          const fs=require('fs'), b=JSON.parse(fs.readFileSync('braces-baseline-audit.json')), a=JSON.parse(fs.readFileSync('braces-candidate-audit.json'));
          const before=b.vulnerabilities||{},after=a.vulnerabilities||{};
          const result={baseline:b.metadata?.vulnerabilities,candidate:a.metadata?.vulnerabilities,braces:require('./package-lock.json').packages['node_modules/braces']?.version,removed:Object.keys(before).filter(k=>!after[k]),added:Object.keys(after).filter(k=>!before[k]),changed:Object.keys(after).filter(k=>before[k]&&before[k].severity!==after[k].severity)};
          fs.writeFileSync('braces-probe-summary.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braces-targeted-probe
          path: |
            braces-baseline-audit.json
            braces-candidate-audit.json
            braces-probe-summary.json
            braces-candidate.patch
          if-no-files-found: warn
