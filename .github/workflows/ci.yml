name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Mission 9.10 — the `defaults.run.working-directory: ./sails-push-ready`
    # that previously lived here was a real, confirmed bug (docs/GITHUB_PROJECT.md
    # #44/TECHNICAL_DEBT_AUDIT.md #44): the repository root IS the working
    # directory in a real `actions/checkout` — that path only ever existed
    # on one contributor's own locally-nested folder layout, never inside a
    # GitHub Actions runner. Removed; every step below now runs at the
    # actual repository root, matching every other workflow in this repo.
    #
    # Missão 11 Fase 6.3B.1 — `npm test` now includes a real-Postgres
    # integration lane (npm run test:integration:postgres); this
    # ephemeral service container is what makes that lane run for real
    # in CI instead of failing the fail-closed authorization/connectivity
    # guard. Created fresh per run, discarded afterward.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Issue #302 — canonical registration now requires a Redis-backed
      # registration challenge, so every integration test that registers a
      # participant needs a real Redis alongside Postgres.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Syntax only, no execution: bash runs a script incrementally, so a syntax error late in a long test
      # script (an unbalanced quote at line 282 cost a 17-minute run) only shows when it gets there.
      - name: Shell syntax check (scripts and self-hosting kit)
        run: |
          for f in scripts/*.sh deploy/self-host/sails-node; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        # Mission 9.10 — a third, real, previously-hidden root cause,
        # found and reproduced locally (not guessed) once the first two
        # fixes let this workflow run far enough to reach it: neither
        # workflow ever built the workspace packages. `@satsails/p2p-
        # trading-sdk`'s package.json points its "types"/"main" fields at
        # `dist/` (gitignored, never committed) — jest.config.js's own
        # moduleNameMapper only covers Jest's RUNTIME resolution, not
        # ts-jest's separate TypeScript diagnostic pass, which resolves
        # imports via node_modules -> the workspace symlink -> this
        # package's own "types" field, exactly like a real consumer
        # would. Reproduced locally byte-for-byte (removed dist/,
        # got the identical TS2307; restored it, passed again) before
        # writing this fix — see docs/TECHNICAL_DEBT_AUDIT.md #49.
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk

      - name: Generate Prisma Client
        # Mission 9.10 — the real, confirmed root cause of every prior
        # CI Tests failure (jest-output.txt from run 33352899462: "Module
        # '@prisma/client' has no exported member 'Prisma'/'PrismaClient'/
        # 'AssetType'" across 80 suites). `npm ci` installs @prisma/client's
        # own unbuilt stub; only `prisma generate` populates its real,
        # schema-derived exports. Neither workflow ever ran it — `db:migrate`
        # (prisma migrate deploy) does not implicitly generate. This step
        # was missing, not the Postgres service container.
        run: npm run db:generate

      - name: Apply database migrations
        # Scoped to this step only — targets the ephemeral CI Postgres
        # service above, never a shared or production database.
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
        run: npm run db:migrate

      - name: Run unit tests
        # Vars scoped to this step only (Missão 11 Fase 6.3B.1) —
        # SAILS_INTEGRATION_TEST_DB_CONFIRMED is the explicit, deliberate
        # opt-in tests/integration/postgresTestHarness.ts's fail-closed
        # guard requires; DATABASE_URL points only at the ephemeral CI
        # service above. None of these vars are present for the Docker
        # integration-test step below, which never needs them —
        # docker-compose.yml hardcodes its own DATABASE_URL for the
        # containers it starts and does not read this one.
        #
        # M9.10-R root cause: TRUSTED_ARBITRATORS was never set anywhere
        # in this workflow. src/config/index.ts reads it once, at
        # module-import time; when empty, dispute.service.ts's lazy
        # singleton getDisputeService() throws ValidationError on its
        # first call and stays broken for the rest of that worker's
        # process. At least 10 tests/integration/*.test.ts files (and
        # tests/settlementReadAccess.test.ts, fixed separately) assume
        # this var is set — same as every local dev checkout's own
        # gitignored .env already provides (TRUSTED_ARBITRATORS=
        # k6-test-arbiter). Matching that exact value here, rather than
        # patching each affected test file individually, since the
        # dependency is on ambient environment, not on any one file.
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
          SAILS_INTEGRATION_TEST_DB_CONFIRMED: yes-i-am-sure
          TRUSTED_ARBITRATORS: k6-test-arbiter
        run: npm test

      - name: Run Docker integration test
        run: bash ./scripts/docker-test.sh

      # The step above brings up docker-compose, whose `app` service builds the
      # `builder` stage; the image that is actually deployed (`--target
      # runtime`) was never built or run by CI, so a missing COPY in that stage
      # (`Cannot find module '@sails/core'`) kept it from booting unnoticed.
      # This step builds and runs THAT image: pinned Node, non-root, every
      # require resolves, production configuration gates refuse unsafe
      # settings, and /health, /health/live, /health/ready answer in
      # NODE_ENV=production. Any failure fails the job; nothing is published.
      - name: Build and boot the production (runtime) Docker image
        run: bash ./scripts/docker-runtime-test.sh

      # Vulnerability audit of what the production image REALLY contains (the image the step
      # above just built): `npm audit` over the lockfile, failing only on high/critical advisories
      # whose range matches a package copy installed in the image. This keeps the Prisma CLI chain
      # (it lives in the migrate image) and the front-end workspaces out of the verdict without
      # `--omit=optional`, which would also drop the native runtime the QVAC SDK needs. Known,
      # tracked findings are formal exceptions with an expiry date, printed on every run
      # (scripts/production-image-audit.exceptions.json). An audit that cannot run fails the step.
      - name: Audit the packages shipped in the production image
        run: |
          docker run --rm -i --entrypoint node sails-runtime-ci:local - < scripts/image-package-inventory.js > image-inventory.tsv
          npm audit --omit=dev --json > npm-audit.json || true
          node scripts/production-image-audit.js npm-audit.json image-inventory.tsv scripts/production-image-audit.exceptions.json

      # The migration image is shipped too and carries the Prisma CLI chain the server image does not
      # (mysql2, deepmerge-ts, ...). Same audit, same exceptions file, against the image's own inventory.
      - name: Audit the packages shipped in the migration image
        run: |
          docker build --target migrate -t sails-migrate-audit:local .
          docker run --rm -i --entrypoint node sails-migrate-audit:local - < scripts/image-package-inventory.js > migrate-inventory.tsv
          node scripts/production-image-audit.js npm-audit.json migrate-inventory.tsv scripts/production-image-audit.exceptions.json

      # The migration job a release runs BEFORE starting the new server version
      # (docs/DEPLOYMENT.md 6.0), against a throwaway PostgreSQL started by the
      # script itself: applies every migration to an empty database, is
      # idempotent on re-run, fails closed (no DATABASE_URL, unreachable
      # database, wrong password, broken migration), leaks no secret into its
      # logs, and a failing migration keeps the server container from starting.
      # Never touches any real database.
      - name: Migration job against a throwaway PostgreSQL
        run: bash ./scripts/docker-migrate-test.sh

      # The provider-agnostic self-hosting kit (deploy/self-host, docs/SELF_HOSTING.md) on a
      # throwaway Compose project: clean install, update, a failing migration and one with an
      # unknown result (the previous server keeps serving), a server started by hand on an
      # unmigrated database (refuses to boot), rollback, backup/restore, no secret in the logs.
      # No cloud, no registry, no real database.
      - name: Self-hosting kit (install, update, failed update, rollback, restore)
        run: bash ./scripts/self-host-test.sh
