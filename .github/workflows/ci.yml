name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Mission 9.10 — the `defaults.run.working-directory: ./sails-push-ready`
    # that previously lived here was a real, confirmed bug (docs/GITHUB_PROJECT.md
    # #44/TECHNICAL_DEBT_AUDIT.md #44): the repository root IS the working
    # directory in a real `actions/checkout` — that path only ever existed
    # on one contributor's own locally-nested folder layout, never inside a
    # GitHub Actions runner. Removed; every step below now runs at the
    # actual repository root, matching every other workflow in this repo.
    #
    # Missão 11 Fase 6.3B.1 — `npm test` now includes a real-Postgres
    # integration lane (npm run test:integration:postgres); this
    # ephemeral service container is what makes that lane run for real
    # in CI instead of failing the fail-closed authorization/connectivity
    # guard. Created fresh per run, discarded afterward.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Issue #302 — canonical registration now requires a Redis-backed
      # registration challenge, so every integration test that registers a
      # participant needs a real Redis alongside Postgres.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        # Mission 9.10 — a third, real, previously-hidden root cause,
        # found and reproduced locally (not guessed) once the first two
        # fixes let this workflow run far enough to reach it: neither
        # workflow ever built the workspace packages. `@satsails/p2p-
        # trading-sdk`'s package.json points its "types"/"main" fields at
        # `dist/` (gitignored, never committed) — jest.config.js's own
        # moduleNameMapper only covers Jest's RUNTIME resolution, not
        # ts-jest's separate TypeScript diagnostic pass, which resolves
        # imports via node_modules -> the workspace symlink -> this
        # package's own "types" field, exactly like a real consumer
        # would. Reproduced locally byte-for-byte (removed dist/,
        # got the identical TS2307; restored it, passed again) before
        # writing this fix — see docs/TECHNICAL_DEBT_AUDIT.md #49.
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk

      - name: Generate Prisma Client
        # Mission 9.10 — the real, confirmed root cause of every prior
        # CI Tests failure (jest-output.txt from run 33352899462: "Module
        # '@prisma/client' has no exported member 'Prisma'/'PrismaClient'/
        # 'AssetType'" across 80 suites). `npm ci` installs @prisma/client's
        # own unbuilt stub; only `prisma generate` populates its real,
        # schema-derived exports. Neither workflow ever ran it — `db:migrate`
        # (prisma migrate deploy) does not implicitly generate. This step
        # was missing, not the Postgres service container.
        run: npm run db:generate

      - name: Apply database migrations
        # Scoped to this step only — targets the ephemeral CI Postgres
        # service above, never a shared or production database.
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
        run: npm run db:migrate

      - name: Run unit tests
        # Vars scoped to this step only (Missão 11 Fase 6.3B.1) —
        # SAILS_INTEGRATION_TEST_DB_CONFIRMED is the explicit, deliberate
        # opt-in tests/integration/postgresTestHarness.ts's fail-closed
        # guard requires; DATABASE_URL points only at the ephemeral CI
        # service above. None of these vars are present for the Docker
        # integration-test step below, which never needs them —
        # docker-compose.yml hardcodes its own DATABASE_URL for the
        # containers it starts and does not read this one.
        #
        # M9.10-R root cause: TRUSTED_ARBITRATORS was never set anywhere
        # in this workflow. src/config/index.ts reads it once, at
        # module-import time; when empty, dispute.service.ts's lazy
        # singleton getDisputeService() throws ValidationError on its
        # first call and stays broken for the rest of that worker's
        # process. At least 10 tests/integration/*.test.ts files (and
        # tests/settlementReadAccess.test.ts, fixed separately) assume
        # this var is set — same as every local dev checkout's own
        # gitignored .env already provides (TRUSTED_ARBITRATORS=
        # k6-test-arbiter). Matching that exact value here, rather than
        # patching each affected test file individually, since the
        # dependency is on ambient environment, not on any one file.
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
          SAILS_INTEGRATION_TEST_DB_CONFIRMED: yes-i-am-sure
          TRUSTED_ARBITRATORS: k6-test-arbiter
          # #307: exercise atomic relay Lua against this job's ephemeral Redis service.
          RELAY_REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
          # #307 B.3: redisTimeoutRealE2E pauses/kills connections on this job's ephemeral Redis.
          SAILS_REDIS_FAULT_INJECTION_CONFIRMED: yes-isolated-redis
        run: npm test

      - name: Run Docker integration test
        run: bash ./scripts/docker-test.sh
