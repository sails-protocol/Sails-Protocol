<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Stable semantics, replaceable execution</title><desc id="desc">Conceptual macro architecture. Providers execute against the external world and return attributed execution-report Assertions for Core admission and correspondence evaluation. The Core does not observe the external world directly.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7931a"/></marker></defs>
<rect width="1200" height="675" fill="#0d0d0d"/>
<g font-family="Arial" fill="#fff">
<text x="60" y="70" font-size="34" font-weight="700">Stable semantics, replaceable execution</text>
<text x="60" y="110" font-size="18" fill="#aaa">Canonical macro architecture · CORE_ARCHITECTURE.md §§7, 11</text>
<rect x="60" y="225" width="190" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="155" y="255" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Modules / Rulesets</text><text x="155" y="280" text-anchor="middle" font-size="15" fill="#ccc">Domain meaning</text>
<rect x="285" y="225" width="190" height="85" rx="16" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="380" y="255" text-anchor="middle" font-size="19" font-weight="700" fill="#f7931a">Pure Sails Core</text><text x="380" y="280" text-anchor="middle" font-size="15" fill="#ccc">Semantic evaluation</text>
<rect x="520" y="225" width="190" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="615" y="255" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Runtime</text><text x="615" y="280" text-anchor="middle" font-size="15" fill="#ccc">Commit · dispatch</text>
<rect x="755" y="225" width="190" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="850" y="255" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Providers</text><text x="850" y="280" text-anchor="middle" font-size="15" fill="#ccc">Execute · report</text>
<rect x="990" y="225" width="160" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="1070" y="255" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">External World</text><text x="1070" y="280" text-anchor="middle" font-size="15" fill="#ccc">Chains · rails</text>
<path d="M250 267 H285" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M475 267 H520" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 267 H755" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M945 267 H990" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="498" y="203" font-size="14" text-anchor="middle" fill="#ccc">Transition Record</text>
<text x="615" y="334" font-size="14" text-anchor="middle" fill="#aaa">Ordering · recovery</text>
<path d="M850 310 V422 H380 V310" fill="none" stroke="#f7931a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="615" y="402" font-size="17" text-anchor="middle" fill="#f7931a">Execution-report Assertion → admission / correspondence</text>
<text x="600" y="510" font-size="17" text-anchor="middle" fill="#ccc">Core does not observe the external world directly; an Assertion is not world truth.</text>
<text x="600" y="550" font-size="16" text-anchor="middle" fill="#aaa">Conceptual boundaries, not a claim of production availability.</text>
</g></svg>
