<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Settlement identity, capability and eligibility</title><desc id="desc">Asset and rail identify a registered scope; a provider uses an adapter and executes via an external mechanism. Evidence informs a governed eligibility decision, not a consequence of scope or implementation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7931a"/></marker></defs>
<rect width="1200" height="675" fill="#0d0d0d"/>
<g font-family="Arial" fill="#fff">
<text x="60" y="70" font-size="34" font-weight="700">Settlement identity, capability and eligibility</text>
<text x="60" y="110" font-size="18" fill="#aaa">Asset ≠ SettlementRail ≠ SettlementAdapter ≠ SettlementProvider · ADR-002</text>
<rect x="60" y="170" width="190" height="75" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="155" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Asset</text><text x="155" y="225" text-anchor="middle" font-size="15" fill="#ccc">Economic unit</text>
<rect x="60" y="285" width="190" height="75" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="155" y="315" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">SettlementRail</text><text x="155" y="340" text-anchor="middle" font-size="15" fill="#ccc">Network / domain</text>
<rect x="310" y="225" width="240" height="85" rx="16" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="430" y="255" text-anchor="middle" font-size="19" font-weight="700" fill="#f7931a">SettlementScope</text><text x="430" y="280" text-anchor="middle" font-size="15" fill="#ccc">Registered {asset, rail}</text>
<rect x="610" y="170" width="245" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="732.5" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">SettlementProvider</text><text x="732.5" y="225" text-anchor="middle" font-size="15" fill="#ccc">Executes capability</text>
<rect x="610" y="320" width="245" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="732.5" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">SettlementAdapter</text><text x="732.5" y="375" text-anchor="middle" font-size="15" fill="#ccc">Translates semantics</text>
<rect x="900" y="170" width="250" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="1025" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">External Settlement</text><text x="1025" y="225" text-anchor="middle" font-size="15" fill="#ccc">Mechanism</text>
<path d="M250 208 L310 255" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250 322 L310 280" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 255 L610 212" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M732 320 V255" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M855 212 H900" fill="none" stroke="#f7931a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="745" y="291" font-size="14" fill="#ccc">translation</text>
<rect x="240" y="480" width="280" height="85" rx="16" fill="#181818" stroke="#555" stroke-width="1.5"/><text x="380" y="510" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Evidence / Properties</text><text x="380" y="535" text-anchor="middle" font-size="15" fill="#ccc">Necessary input</text>
<rect x="700" y="480" width="300" height="85" rx="16" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="850" y="510" text-anchor="middle" font-size="19" font-weight="700" fill="#f7931a">Production Eligibility</text><text x="850" y="535" text-anchor="middle" font-size="15" fill="#ccc">Governed decision</text>
<path d="M520 522 H700" fill="none" stroke="#f7931a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="610" y="507" font-size="14" text-anchor="middle" fill="#ccc">inform</text>
<text x="600" y="615" text-anchor="middle" font-size="17" fill="#ccc">Scope registration and implementation do not imply production eligibility.</text>
</g></svg>
