# Least-privilege Redis ACLs for the Sails event transport (Redis Gate 2). Redis 7+. Replace every CHANGE_ME with a long random
# secret kept in your secret store, and load this file with `aclfile` (or apply each line with ACL SETUSER). It is a CONFIGURATION
# PROFILE tested by tests/integration/redisGate2Adversarial.test.ts: it is not applied by any compose file and does not by itself make
# Redis Gate 2 GO.
#
# Roles (one connection per role; RedisStreamsEventStore takes the producer connection through `options.producerClient`):
#   sails-producer  writes events and the cross-instance signal. CANNOT read groups, acknowledge, claim, create groups, or administer.
#   sails-consumer  consumes: reads the group, acknowledges, claims, checks pending, and keeps the envelope nonce markers. CANNOT write events
#                   or publish the cross-instance signal. (A consumer that must ALSO publish needs the producer connection.)
#   sails-ops       read-only operator: inspects streams and info; changes nothing.
#   default         off: an unauthenticated connection can do nothing.
# Key space: sails:events:* (streams and correlation streams). The consumer also has ONE selector: SET/GET on sails:envelope:nonce:* only (the replay markers),
# so it cannot SET a key that would shadow a stream. The pub/sub channel is
# sails:cross-instance-events. ioredis clients with these users must use `enableReadyCheck: false` (the ready check runs INFO).
#
# What ACLs do NOT do: a producer or consumer whose own credentials are stolen can still do everything its role allows (a compromised
# producer can write events; with the envelope key it can sign them). Keep the secrets per role, rotate them, and keep the envelope key
# (EVENT_ENVELOPE_KEYS) out of the producer's reach if the producer is the less-trusted component.

user default off
user sails-producer on >CHANGE_ME ~sails:events:* &sails:cross-instance-events -@all +xadd +xrevrange +publish +ping
user sails-consumer on >CHANGE_ME ~sails:events:* &sails:cross-instance-events -@all +xreadgroup +xack +xclaim +xpending +xgroup|create +xrange +xrevrange +eval +evalsha +subscribe +unsubscribe +ping (~sails:envelope:nonce:* +set +get)
user sails-ops on >CHANGE_ME ~sails:* &* -@all +xinfo +xlen +xrange +xrevrange +xpending +info +ping +acl|whoami
