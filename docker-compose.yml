services:
  postgres:
    image: postgres:16-alpine
    # `expose` (not `ports`) - reachable on the compose internal network at
    # `postgres:5432`, NOT bound to the host. The legacy `ports: "5432:5432"`
    # block was removed 2026-08-07: a local-dev Postgres on the host network
    # shadows nothing useful (the app talks to it via the compose network
    # name) and opens a DB-shaped attack surface to anything else running
    # on the developer machine. To debug with psql from the host:
    #   docker compose exec postgres psql -U postgres -d sails_protocol
    # Real gap found 2026-08-15 running a genuinely fresh `docker compose up`
    # (empty volume, no prior state) for the first time: this block never
    # existed, so the official postgres image refused to initialize at all
    # ("Database is uninitialized and superuser password is not specified"),
    # failing the healthcheck and blocking `migrate`/`app` from ever
    # starting. Every environment so far reused an already-initialized
    # volume, so this had never actually been exercised. Values match
    # `migrate`/`app`'s own hardcoded DATABASE_URL below exactly.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sails_protocol
    expose:
      - "5432"
    volumes:
      - sails-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sails_protocol"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Always restart on crash during a local-dev session so a Ctrl-C'd
      # `docker compose down` is the only way to stop it.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Same rationale as postgres: `expose`, not `ports`. Use
    # `docker compose exec redis redis-cli` for host-side debugging.
    expose:
      - "6379"
    volumes:
      - sails-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies prisma/schema.prisma to the postgres service above,
  # then exits. `app` below waits for this to succeed before starting -
  # a fresh `docker compose up` on an empty volume always has a real
  # schema in place before the server's first request, no separate manual
  # step. Builds the Dockerfile's `migrate` target: the same small image and
  # entrypoint (scripts/migrate-deploy.sh: migrate deploy + migrate status,
  # non-zero on any failure) that a production rollout runs before starting
  # the new server version. This repo never runs a migration implicitly on a
  # server container's own start.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sails_protocol
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no" # One-shot: don't loop migrations if the run fails

  # The whole point of this service (2026-08-03): `docker compose up` is
  # now the entire "get this running" story - no Node/npm install on the
  # host, no manual `npm run dev`, no secrets to generate. Deliberately
  # NOT the same target the real Dockerfile's own CMD uses (`runtime`,
  # slim, no devDependencies) - this uses `builder` instead so `pino-pretty`
  # (a devDependency; NODE_ENV is intentionally left unset here, which
  # defaults to 'development' per config/index.ts, and that's what turns
  # pretty-printed logs on) is actually present. MOCK_ESCROW/
  # MOCK_SETTLEMENT stay true - this is the safe, no-secrets-needed local
  # onboarding path, never the real-custody one (see docs/DEPLOYMENT.md
  # section 8 for that, entirely separate).
  app:
    build:
      context: .
      target: builder
    command: node dist/src/main.js
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sails_protocol
      REDIS_URL: redis://redis:6379
      PORT: 3000
      HOST: 0.0.0.0
      MOCK_ESCROW: "true"
      MOCK_SETTLEMENT: "true"
      # Both off by default in the codebase (config/index.ts) — kept off
      # here too as of the 2026-08-15 security review (P2 finding): the
      # 2026-08-09 project-owner decision that turned these on here was a
      # real, deliberate demo choice ("one command up, AI already
      # visible"), but an external security review correctly flagged it
      # as a surprising baseline — anyone running `docker compose up` for
      # the first time gets automated AI dispute resolution active by
      # default, protected only by MOCK_ESCROW/MOCK_SETTLEMENT (no real
      # funds move, but still not an obvious thing to opt into silently).
      # To restore the demo behavior deliberately: uncomment below, or
      # set the same two env vars in a docker-compose.override.yml (not
      # tracked). QVAC_AUTO_RESOLUTION_CONFIDENCE_THRESHOLD/_WINDOW_HOURS
      # only matter once QVAC_AUTO_RESOLUTION_ENABLED is true — see
      # .env.example's own comments on each flag for what turning them on
      # means. The env-var-not-passed-through gap this comment used to
      # describe (QVAC_AUTO_RESOLUTION_ENABLED/SOCIAL_ENGINEERING_DETECTION
      # never reaching the container even if set in .env, since this
      # block has no `env_file: .env`) is fixed by listing them explicitly
      # here, same as every other var in this block.
      QVAC_AUTO_RESOLUTION_ENABLED: "false"
      QVAC_AUTO_RESOLUTION_CONFIDENCE_THRESHOLD: "0.85"
      QVAC_AUTO_RESOLUTION_WINDOW_HOURS: "24"
      SOCIAL_ENGINEERING_DETECTION: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # App-level healthcheck (added 2026-08-07) - mirrors the Dockerfile's
    # HEALTHCHECK so `docker compose ps` shows the same state whether the
    # image was started via compose or directly via `docker run`. Uses
    # /health/live (process-only, no DB/Redis touch) so a transient DB
    # outage doesn't trigger an unhealthy state here - that signal is
    # /health/ready's job, which compose doesn't watch directly (the
    # k8s-style "stop routing traffic to me" semantics don't apply in a
    # single-replica compose setup).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 3s
      retries: 3
      # Wait for the app to actually bind the port - first cold start
      # pulls + prisma generate + tsc, ~10-20s on a typical laptop.
      start_period: 30s
    restart: unless-stopped

volumes:
  sails-postgres-data:
  sails-redis-data:
